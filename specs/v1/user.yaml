components:
  pathItems:
    CurrentUser:
      get:
        tags:
          - Users
        operationId: getMe
        summary: Obtener información del usuario
        security:
          - BearerAuth: []
        responses:
          "200":
            description: Información del usuario autenticado.
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/User"
          "401":
            $ref: common.yaml#/components/responses/Unauthorized
          "404":
            $ref: common.yaml#/components/responses/NotFound
          "500":
            $ref: common.yaml#/components/responses/InternalError
    Users:
      get:
        tags: [Users]
        operationId: listUsers
        summary: Listar usuarios de la instancia
        security: []
        responses:
          "200":
            description: Usuarios registrados
            content:
              application/json:
                schema:
                  type: array
                  items: { $ref: "#/components/schemas/User" }
          "401": { $ref: common.yaml#/components/responses/Unauthorized }
          "403": { $ref: common.yaml#/components/responses/Forbidden }
    UserById:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      get:
        tags: [Users]
        operationId: getUser
        summary: Obtener usuario por identificador
        security: [{ BearerAuth: [] }]
        responses:
          "200":
            description: Usuario registrado
            content:
              application/json:
                schema: { $ref: "#/components/schemas/User" }
          "401": { $ref: common.yaml#/components/responses/Unauthorized }
          "403": { $ref: common.yaml#/components/responses/Forbidden }
          "404": { $ref: common.yaml#/components/responses/NotFound }
      patch:
        tags: [Users]
        operationId: updateUserAccess
        summary: Actualizar el acceso institucional de un usuario
        security: [{ BearerAuth: [] }]
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required: [isAdmin, isPublicServant]
                properties:
                  isAdmin:
                    type: boolean
                  isPublicServant:
                    type: boolean
        responses:
          "200":
            description: Usuario actualizado
            content:
              application/json:
                schema: { $ref: "#/components/schemas/User" }
          "401": { $ref: common.yaml#/components/responses/Unauthorized }
          "403": { $ref: common.yaml#/components/responses/Forbidden }
          "404": { $ref: common.yaml#/components/responses/NotFound }

  schemas:
    User:
      type: object
      description: Every user is a citizen. The access flags grant additional, independent capabilities.
      required: [id, name, sub, email, emailVerified, isAdmin, isPublicServant]
      properties:
        id:
          type: integer
          format: int64
          x-order: 1
        name:
          type: string
          example: John Doe
        sub:
          type: string
          example: 7g34748743g843g7
        email:
          type: string
          format: email
          example: john.doe@example.com
        emailVerified:
          type: boolean
          example: true
        isAdmin:
          type: boolean
          description: Whether the citizen also has system administration access.
          example: false
        isPublicServant:
          type: boolean
          description: Whether the citizen is also authorized to act as a public servant.
          example: true
