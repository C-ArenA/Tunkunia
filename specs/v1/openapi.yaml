openapi: "3.1.0"
info:
  title: Tunkunia API
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: "1.0"
  description: |
    Interfaz de interacción con el subsistema de gestión de flujos de trámite Tunkunia.
    Esta especificación se usará para consumo de los distintos tipos de clientes.
    Para lograr uniformidad se siguen prácticas de la industria y estándares vigentes:
      - [RFC 9457](https://datatracker.ietf.org/doc/html/rfc9457)
      - [Documentación](https://docs.stripe.com/api-v2-overview) y [Referencia](https://docs.stripe.com/api/v2/core/accounts) de la API de Stripe v2
      - Guías de diseño de APIs de [Google](https://docs.cloud.google.com/apis/design) y de [Microsoft](https://github.com/microsoft/api-guidelines) (Azure y Legacy)
servers:
  - url: /api/v1
    description: Mismo origen que la referencia de la API.
tags:
  - name: Catalog
    description: Catálogo institucional de trámites.
  - name: Authn
    description: Identidad del usuario autenticado.
  - name: Health
    description: Estado operativo del servicio.
  - name: Workflows
    description: Definiciones ejecutables, casos, tareas y notificaciones.
  - name: Users
    description: Gestión institucional de usuarios.
paths:
  /health:
    $ref: health.yaml#/components/pathItems/Health
  /tramites:
    $ref: catalog.yaml#/components/pathItems/Tramites
  /tramites/{id}:
    $ref: catalog.yaml#/components/pathItems/TramiteById
  /me:
    $ref: authn.yaml#/components/pathItems/CurrentUser
  /users:
    $ref: authn.yaml#/components/pathItems/Users
  /users/{id}/roles:
    $ref: authn.yaml#/components/pathItems/UserRoles
  /tramites/{id}/procedure:
    $ref: workflow.yaml#/components/pathItems/PublishedProcedure
  /tramites/{id}/procedure/draft:
    $ref: workflow.yaml#/components/pathItems/DraftProcedure
  /tramites/{id}/procedure/draft/publish:
    $ref: workflow.yaml#/components/pathItems/PublishProcedure
  /tramites/{id}/archive:
    $ref: workflow.yaml#/components/pathItems/ArchiveTramite
  /tramites/{id}/cases:
    $ref: workflow.yaml#/components/pathItems/StartCase
  /cases:
    $ref: workflow.yaml#/components/pathItems/Cases
  /cases/{id}:
    $ref: workflow.yaml#/components/pathItems/CaseById
  /cases/{id}/claim:
    $ref: workflow.yaml#/components/pathItems/ClaimCase
  /cases/{id}/transitions/{transitionId}/fire:
    $ref: workflow.yaml#/components/pathItems/FireTransition
  /tasks:
    $ref: workflow.yaml#/components/pathItems/Tasks
  /notifications:
    $ref: workflow.yaml#/components/pathItems/Notifications
  /notifications/{id}/read:
    $ref: workflow.yaml#/components/pathItems/ReadNotification
components:
  securitySchemes:
    BearerAuth:
      $ref: common.yaml#/components/securitySchemes/BearerAuth
