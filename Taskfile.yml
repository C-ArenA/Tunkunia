# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

dotenv:
  - ".env"

output: prefixed

includes:
  site:
    taskfile: ./site/Taskfile.yml
    dir: ./site
  spa:
    taskfile: ./spa/Taskfile.yml
    dir: ./spa
  docs:
    taskfile: ./docs/Taskfile.yml
    dir: ./docs

tasks:
  migrate:fresh:
    cmds:
      - echo "Using $GOOSE_DBSTRING"
      - rm -f $GOOSE_DBSTRING
      - go tool goose up

  oapi:join:
    desc: Joins multiple openapi specs into one
    cmds:
      - >
        watchexec
        -w ./internal/catalog
        -w ./internal/api
        -w ./internal/audit
        redocly join
        ./internal/api/openapi.yaml
        ./internal/audit/openapi.yaml
        ./internal/catalog/openapi.yaml
        -o ./tunkunia.openapi.yaml
        --without-x-tag-groups
      - cp ./tunkunia.openapi.yaml ./site/public/tunkunia.openapi.yaml

  scalar:serve:
    desc: Serves a scalar api reference
    prefix: scalar
    preconditions:
      - test -f ./tunkunia.openapi.yaml
    cmds:
      - scalar document serve --watch --port 8491 ./tunkunia.openapi.yaml

  server:dev:
    prefix: GO
    desc: Run server with hot reload (air)
    cmds:
      - go tool air serve

  server:build:
    desc: Build server binary
    cmds:
      - go build -o bin/server ./cmd/api

  dev:all:
    desc: Run all dev servers in parallel
    deps:
      - oapi:join
      - scalar:serve
      - server:dev
      - spa:dev
    cmds:
      - echo ""

  build:all:
    desc: Build all projects
    cmds:
      - task: server:build
      - task: site:build
      - task: spa:build

  docs:all:
    desc: Generate all documentation
    cmds:
      - task: docs:typstout
      - task: docs:plantuml
