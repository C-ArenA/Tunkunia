# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  GREETING: Hello, world!

tasks:
  default:
    desc: Print a greeting message
    cmds:
      - echo "{{.GREETING}}"

  dev:server:
    desc: Run server with hot reload (air)
    dir: ./server
    cmds:
      - air

  dev:site:
    desc: Run site dev server
    dir: ./site
    cmds:
      - pnpm run dev

  dev:ui:
    desc: Run UI dev server
    dir: ./ui
    cmds:
      - pnpm run dev

  dev:all:
    desc: Run all dev servers in parallel
    deps:
      - dev:server
      - dev:site
      - dev:ui
    cmds:
      - echo ""

  build:server:
    desc: Build server binary
    dir: ./server
    cmds:
      - go build -o bin/server ./cmd/api

  build:site:
    desc: Build site for production
    dir: ./site
    cmds:
      - pnpm run build

  build:ui:
    desc: Build UI for production
    dir: ./ui
    cmds:
      - pnpm run build

  build:all:
    desc: Build all projects
    cmds:
      - task: build:server
      - task: build:site
      - task: build:ui

  docs:typstout:
    desc: Run Typstout documentation generator
    cmds:
      - go run tooling/typstout/main.go -target ./docs

  docs:plantuml:
    desc: Generate PlantUML diagrams
    cmds:
      - plantuml ./docs/**/*.puml --svg

  docs:all:
    desc: Generate all documentation
    cmds:
      - task: docs:typstout
      - task: docs:plantuml
