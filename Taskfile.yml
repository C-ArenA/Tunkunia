# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

output: prefixed

includes:
  server:
    taskfile: ./server/Taskfile.yml
    dir: ./server
  site:
    taskfile: ./site/Taskfile.yml
    dir: ./site
  ui:
    taskfile: ./ui/Taskfile.yml
    dir: ./ui
  docs:
    taskfile: ./docs/Taskfile.yml
    dir: ./docs

tasks:
  dev:all:
    desc: Run all dev servers in parallel
    deps:
      - server:dev
      - site:dev
      - ui:dev
    cmds:
      - echo ""

  build:all:
    desc: Build all projects
    cmds:
      - task: server:build
      - task: site:build
      - task: ui:build

  docs:all:
    desc: Generate all documentation
    cmds:
      - task: docs:typstout
      - task: docs:plantuml