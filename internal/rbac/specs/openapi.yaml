openapi: "3.0.3"
info:
  title: RBACModuleAPI
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: "1.0"
  description: |
    Role-Based Access Control module for managing roles, permissions, and user-role assignments.
servers:
  - url: http://localhost:8080/api/v1
    description: Development server
  - url: https://{host}/api/v1
    variables:
      host:
        default: tunkunia.com
        description: Host o dominio de la API
paths:
  /rbac/roles:
    get:
      tags:
        - RBAC
      operationId: listRoles
      summary: Listar Roles
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Lista de roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "401":
          $ref: "../../api/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "../../api/openapi.yaml#/components/responses/Forbidden"
    post:
      tags:
        - RBAC
      operationId: createRole
      summary: Crear Rol
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleCreate"
      responses:
        "201":
          description: Rol creado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "../../api/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../../api/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "../../api/openapi.yaml#/components/responses/Forbidden"
  /rbac/roles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags:
        - RBAC
      operationId: getRole
      summary: Obtener Rol
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Rol encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "401":
          $ref: "../../api/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "../../api/openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../../api/openapi.yaml#/components/responses/NotFound"
    patch:
      tags:
        - RBAC
      operationId: updateRole
      summary: Modificar Rol
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleUpdate"
      responses:
        "200":
          description: Rol actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "../../api/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../../api/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "../../api/openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../../api/openapi.yaml#/components/responses/NotFound"
    delete:
      tags:
        - RBAC
      operationId: deleteRole
      summary: Eliminar Rol
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Rol eliminado
        "401":
          $ref: "../../api/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "../../api/openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../../api/openapi.yaml#/components/responses/NotFound"
  /rbac/permissions:
    get:
      tags:
        - RBAC
      operationId: listPermissions
      summary: Listar Permisos
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Lista de permisos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"
        "401":
          $ref: "../../api/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "../../api/openapi.yaml#/components/responses/Forbidden"
  /rbac/roles/{id}/permissions:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags:
        - RBAC
      operationId: getRolePermissions
      summary: Obtener Permisos de un Rol
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Permisos del rol
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"
        "401":
          $ref: "../../api/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "../../api/openapi.yaml#/components/responses/Forbidden"
    post:
      tags:
        - RBAC
      operationId: setRolePermissions
      summary: Asignar Permisos a un Rol
      description: Reemplaza todos los permisos del rol con la lista proporcionada
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionIDs"
      responses:
        "200":
          description: Permisos actualizados exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"
        "400":
          $ref: "../../api/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../../api/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "../../api/openapi.yaml#/components/responses/Forbidden"
  /rbac/users/{id}/roles:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags:
        - RBAC
      operationId: getUserRoles
      summary: Obtener Roles de un Usuario
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Roles del usuario
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "401":
          $ref: "../../api/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "../../api/openapi.yaml#/components/responses/Forbidden"
    post:
      tags:
        - RBAC
      operationId: setUserRoles
      summary: Asignar Roles a un Usuario
      description: Reemplaza todos los roles del usuario con la lista proporcionada
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleIDs"
      responses:
        "200":
          description: Roles actualizados exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "400":
          $ref: "../../api/openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "../../api/openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "../../api/openapi.yaml#/components/responses/Forbidden"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your application JWT token
  schemas:
    Role:
      type: object
      required:
        - id
        - name
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
          x-order: 1
        name:
          type: string
          example: admin
          x-order: 2
        description:
          type: string
          example: Administrador del sistema
          x-order: 3
        createdAt:
          type: string
          format: date-time
          x-order: 4
        updatedAt:
          type: string
          format: date-time
          x-order: 5
    RoleCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
    RoleUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
    Permission:
      type: object
      required:
        - id
        - resource
        - action
      properties:
        id:
          type: integer
          format: int64
          x-order: 1
        resource:
          type: string
          example: catalog
          x-order: 2
        action:
          type: string
          example: read
          x-order: 3
        description:
          type: string
          example: Leer trámites
          x-order: 4
    PermissionIDs:
      type: object
      required:
        - permission_ids
      properties:
        permission_ids:
          type: array
          items:
            type: integer
    RoleIDs:
      type: object
      required:
        - role_ids
      properties:
        role_ids:
          type: array
          items:
            type: integer
