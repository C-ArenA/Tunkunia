openapi: "3.0.3"
info:
  title: CatalogModuleAPI
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: "1.0"
  description: |
    Deals with the lifecycle of "Trámites" (Government Procedures) and their associated Petri net execution structures.

    ### Authorization Rules:
    - **Published** trámites are accessible by anyone (including anonymous `guest` users).
    - **Draft** and **Archived** trámites are strictly restricted to their `creator` or an `admin`.
servers:
  - url: http://localhost:8080/api/v1
    description: Development server
  - url: https://{host}/api/v1
    variables:
      host:
        default: tunkunia.com
        description: Host o dominio de la API
paths:
  /catalog/health:
    $ref: "../../../api/shared.openapi.yaml#/paths/~1module~1health"
  /catalog/tramites:
    get:
      tags:
        - Catalog
      operationId: ListTramites
      summary: Listar Trámites
      description: |
        Obtiene una lista de trámites paginados
        - **Guests** will only see `published` items.
        - **Creators** will see their own drafts/archived items alongside published ones.
        - **Admins** will see everything.
      security:
        - BearerAuth: []
        - {}
      parameters:
        - name: status
          in: query
          description: Filter trámites by status
          required: false
          schema:
            $ref: "#/components/schemas/TramiteStatus"
        - name: page
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: A paginated list of trámites.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TramiteCollection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - Catalog
      operationId: createTramite
      summary: Crear Trámite
      description: Permite a usuarios con rol de administración la creación de nuevos trámites en el catálogo de trámites. Los mismos nacerán con estado draft y pueden contener un procedimiento vacío
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TramiteCreate"
      responses:
        "201":
          description: Creación de Trámite exitosa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tramite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /catalog/tramites/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID del Trámite
        schema:
          type: integer
    get:
      tags:
        - Catalog
      operationId: getTramite
      summary: Obtener Trámite
      security:
        - BearerAuth: []
        - {}
      responses:
        "200":
          description: Detalles del Trámite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tramite"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

      deprecated: false
    patch:
      tags:
        - Catalog
      operationId: updateTramite
      summary: Modificar Trámite
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TramiteUpdate"
      responses:
        "200":
          description: Trámite actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tramite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

    delete:
      tags:
        - Catalog
      operationId: deleteTramite
      summary: Eliminar Trámite
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Trámite eliminado, nada que retornar
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      deprecated: false

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your application JWT token
  schemas:
    TramiteStatus:
      type: string
      enum: [draft, published, archived]
      example: draft

    TramiteType:
      type: string
      enum:
        - Otro
        - Trámite de registro
        - Trámite de certificación
        - Trámite de constancia
        - Trámite para cumplir con obligaciones
        - Trámite para acceder a servicios
        - Trámite para obtener permisos
      x-enumNames:
        - Otro
        - Registro
        - Certification
        - Constancia
        - Obligation
        - Servicio
        - Permiso
      example: Otro

    TramiteBase:
      type: object
      required: [id, name, description]
      properties:
        id:
          type: integer
          format: int64
          x-order: 1
        name:
          type: string
          example: "Inscripción de Personería Jurídica"
          x-order: 2
        description:
          type: string
          example: "Trámite legal para la obtención y registro de personería jurídica de asociaciones civiles."
          x-order: 3

    Tramite:
      allOf:
        - $ref: "#/components/schemas/TramiteBase"
        - $ref: ../../audit/openapi.yaml#/components/schemas/AuditMetadata
        - type: object
          required: [procedureDescription, type, status, createdAt, updatedAt]
          properties:
            procedureDescription:
              type: string
              example: "El usuario debe cargar los requisitos formales, esperar validación de actas y proceder a la firma digital."
            type:
              $ref: "#/components/schemas/TramiteType"
            status:
              $ref: "#/components/schemas/TramiteStatus"

    TramiteCollection:
      allOf:
        - $ref: "../../../api/shared.openapi.yaml#/components/schemas/CollectionBase"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/TramiteBase"

    TramiteCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        procedureDescription:
          type: string
        type:
          $ref: "#/components/schemas/TramiteType"

    TramiteUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        procedureDescription:
          type: string
        type:
          $ref: "#/components/schemas/TramiteType"
        status:
          $ref: "#/components/schemas/TramiteStatus"

  responses:
    BadRequest:
      $ref: "../../../api/errors.openapi.yaml#/components/responses/BadRequest"

    Unauthorized:
      $ref: "../../../api/errors.openapi.yaml#/components/responses/Unauthorized"

    Forbidden:
      $ref: "../../../api/errors.openapi.yaml#/components/responses/Forbidden"

    NotFound:
      $ref: "../../../api/errors.openapi.yaml#/components/responses/NotFound"

    ValidationError:
      $ref: "../../../api/errors.openapi.yaml#/components/responses/ValidationError"

    InternalError:
      $ref: "../../../api/errors.openapi.yaml#/components/responses/InternalError"
