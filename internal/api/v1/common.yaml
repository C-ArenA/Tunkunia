components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT de la aplicación.
  schemas:
    CollectionBase:
      type: object
      required: [nextPageUrl, previousPageUrl]
      properties:
        nextPageUrl:
          type: [string, "null"]
          format: uri
          example: "https://api.example.com/tramites?page=next-cursor"
        previousPageUrl:
          type: [string, "null"]
          format: uri
          example: "https://api.example.com/tramites?page=previous-cursor"
    ProblemDetails:
      type: object
      description: >
        Objeto estricto de detalles de problema de Tunkunia, basado en RFC 9457.
        Se serializa con el tipo de medio "application/problem+json" y admite
        miembros adicionales de extensión.
      required: [title, status, detail]
      properties:
        type:
          type: string
          format: uri-reference
          default: "about:blank"
          description: Referencia URI que identifica el tipo de problema.
          example: "/problems/invalid-citizen"
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
          description: Código de estado que coincide con la respuesta HTTP.
          example: 403
        title:
          type: string
          description: Resumen legible del tipo de problema.
          example: "Usted no es participante de este caso de trámite."
        detail:
          type: string
          description: Explicación de esta ocurrencia orientada a corregir el problema.
          example: "Su caso de trámite con código 500424 no se encuentra vigente"
        instance:
          type: string
          format: uri-reference
          description: Referencia URI que identifica esta ocurrencia del problema.
          example: "/cuenta/12345/mensajes/abc"
    ErrorDetail:
      type: object
      description: Error de validación basado en el ejemplo de la sección 3 de RFC 9457.
      required: [detail, pointer]
      properties:
        detail:
          type: string
        pointer:
          type: string
  responses:
    BadRequest:
      description: Solicitud no aceptada o entendida. Quizá falte algún parámetro requerido.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Unauthorized:
      description: No se ha provisto una credencial válida.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Forbidden:
      description: No tiene permisos para realizar esta solicitud.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: El recurso solicitado no existe.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ValidationError:
      description: Los datos provistos son incorrectos.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ProblemDetails"
              - type: object
                required: [errors]
                properties:
                  errors:
                    type: array
                    description: Lista de errores de validación identificados.
                    items:
                      $ref: "#/components/schemas/ErrorDetail"
    InternalError:
      description: No se pudo ejecutar la solicitud.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
