components:
  pathItems:
    CurrentUser:
      get:
        tags:
          - Authn
        operationId: getMe
        summary: Obtener información del usuario
        security:
          - BearerAuth: []
        responses:
          "200":
            description: Información del usuario autenticado.
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/User"
          "401":
            $ref: common.yaml#/components/responses/Unauthorized
          "404":
            $ref: common.yaml#/components/responses/NotFound
          "500":
            $ref: common.yaml#/components/responses/InternalError
  
  schemas:
    User:
      type: object
      required: [id, name, sub, email, emailVerified, roles]
      properties:
        id:
          type: integer
          format: int64
          x-order: 1
        name:
          type: string
          example: John Doe
        sub:
          type: string
          example: 7g34748743g843g7
        email:
          type: string
          format: email
          example: john.doe@example.com
        emailVerified:
          type: boolean
          example: true
        roles:
          type: array
          items:
            type: string
          example: [admin, user]
