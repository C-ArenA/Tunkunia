# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

output: prefixed

vars:
  TYPST_FLAGS: --root . --font-path shared/fonts --ignore-system-fonts

tasks:
  build:memoria:
    desc: Build the thesis PDF
    cmds:
      - mkdir -p build
      - typst compile {{.TYPST_FLAGS}} memoria/memoria.typ build/memoria.pdf

  build:report:
    desc: Build the first project report
    cmds:
      - mkdir -p build
      - typst compile {{.TYPST_FLAGS}} supporting/report1.typ build/report1.pdf

  build:lean:
    desc: Build the lean canvas
    cmds:
      - mkdir -p build
      - typst compile {{.TYPST_FLAGS}} supporting/lean.typ build/lean.pdf

  build:all:
    desc: Build every supported Typst entrypoint
    cmds:
      - task: build:memoria
      - task: build:report
      - task: build:lean

  fmt:
    desc: Format active Typst documents and the shared theme
    cmds:
      - typstyle --inplace memoria/memoria.typ supporting/*.typ shared/acronyms.typ shared/glossary.typ shared/theme/*.typ

  fmt:check:
    desc: Check formatting of active Typst documents and the shared theme
    cmds:
      - typstyle --check memoria/memoria.typ supporting/*.typ shared/acronyms.typ shared/glossary.typ shared/theme/*.typ

  check:
    desc: Check formatting and compile every supported document
    cmds:
      - task: fmt:check
      - task: build:all

  typstout:
    desc: Run Typstout documentation generator
    cmds:
      - cd .. && go run tooling/typstout/main.go -target .

  plantuml:
    desc: Generate PlantUML figures from their editable sources
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
    cmds:
      - plantuml assets/sources/*.puml --svg -o ../figures

  mermaid:
    desc: Generate Mermaid figures as PDFs from their editable sources
    vars:
      SOURCES:
        sh: find assets/sources -maxdepth 1 -type f -name '*.mmd' -print
    cmds:
      - for:
          var: SOURCES
        cmd: mmdc --input {{.ITEM}} --output assets/figures/{{trimSuffix ".mmd" (base .ITEM)}}.pdf --pdfFit
