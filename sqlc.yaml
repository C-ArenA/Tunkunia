version: "2"
# Se puede crear un elemento de sql por cada módulo o incluso varios. Todos usando el mismo schema
sql:
  - engine: "sqlite"
    schema: "database/migrations"
    queries: "internal/catalog/query.sql"
    gen:
      go:
        package: "store"
        out: "internal/catalog/store"
        omit_unused_structs: true

  - engine: "sqlite"
    schema: "database/migrations"
    queries:
      - "internal/catalog/query.sql"
      - "internal/user/query.sql"
    gen:
      go:
        package: "sqlc"
        out: "database/sqlc"
        emit_interface: true
        emit_methods_with_db_argument: true
        emit_sql_as_comment: true
